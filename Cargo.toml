[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "tests/architecture",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jaoppb/tools"
publish = false

[workspace.dependencies]
arch-lint = "0.11"
cel-interpreter = { version = "0.10.0", default-features = false }
cel-parser = "0.10.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
deunicode = "1.6.0"
regex = "1.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "0.8.23"
tools-core = { path = "crates/core" }
