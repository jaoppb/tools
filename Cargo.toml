[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/project-sync",
    "crates/issues-check",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jaoppb/tools"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "0.8.23"
tools-core = { path = "crates/core" }
