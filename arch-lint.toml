preset = "recommended"

[rules.no-unwrap-expect]
allow_in_tests = true

[rules.no-silent-result-drop]
allow_in_tests = true
allow_ok = true

[rules.no-sync-io]
enabled = false

[[scopes]]
name = "domain"
paths = ["crates/core/src/domain/**"]

[[scopes]]
name = "application"
paths = ["crates/core/src/application/**"]

[[scopes]]
name = "adapters"
paths = ["crates/core/src/adapters/**"]

[[deny-scope-dep]]
name = "domain-is-innermost"
from = "domain"
to = ["application", "adapters"]
message = "domain must not depend on application or adapters"
severity = "error"

[[deny-scope-dep]]
name = "application-before-adapters"
from = "application"
to = ["adapters"]
message = "application must not depend on adapters"
severity = "error"

[[restrict-use]]
name = "core-is-foundational"
files = ["crates/core/**"]
deny = ["tools::**", "clap::**"]
message = "crates/core must not depend on the CLI crate or clap"
severity = "error"

[[restrict-use]]
name = "project-isolation"
files = ["crates/cli/src/project/**", "crates/cli/tests/project.rs"]
deny = ["crate::issues::**", "crate::repo::**", "tools::issues::**", "tools::repo::**"]
message = "the project group must not depend on the other groups"
severity = "error"

[[restrict-use]]
name = "issues-isolation"
files = ["crates/cli/src/issues/**", "crates/cli/tests/issues.rs"]
deny = ["crate::project::**", "crate::repo::**", "tools::project::**", "tools::repo::**"]
message = "the issues group must not depend on the other groups"
severity = "error"

[[restrict-use]]
name = "repo-isolation"
files = ["crates/cli/src/repo/**", "crates/cli/tests/repo.rs", "crates/cli/tests/consistency.rs"]
deny = ["crate::project::**", "crate::issues::**", "tools::project::**", "tools::issues::**"]
message = "the repo group must not depend on the other groups"
severity = "error"

[[restrict-use]]
name = "repo-domain-is-serde-free"
files = ["crates/core/src/domain/repo/**"]
deny = ["serde::**", "serde_json::**", "toml::**"]
message = "the repo domain must not know the shape of tools.toml or of the GitHub wire format; those live in config/schema and adapters/github"
severity = "error"
