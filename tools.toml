[github.repository]
owner = "jaoppb"
name = "tools"

[github.repository.settings]
allow_merge_commit = true
allow_squash_merge = false
allow_rebase_merge = false
delete_branch_on_merge = true
merge_commit_title = "PR_TITLE"
merge_commit_message = "PR_BODY"

[github.labels]
unmanaged = "warn"
docs = ["AGENTS.md", "CONTRIBUTING.md"]
deprecated = [
    "bug",
    "documentation",
    "duplicate",
    "enhancement",
    "good first issue",
    "help wanted",
    "invalid",
    "question",
    "wontfix",
    "epic",
    "accessibility",
]
items = [
    { name = "type:feat", color = "1d76db", description = "New behaviour or capability" },
    { name = "type:fix", color = "d73a4a", description = "Something is broken" },
    { name = "type:chore", color = "8b949e", description = "Tooling, CI, housekeeping, dependencies" },
    { name = "type:docs", color = "0075ca", description = "Documentation, guides, specifications" },
    { name = "type:refactor", color = "5319e7", description = "Restructure without changing behaviour" },
    { name = "type:spike", color = "fbca04", description = "Time-boxed research that answers a question" },
    { name = "area:core", color = "2ea44f", description = "crates/core: domain models, github client, config" },
    { name = "area:project-sync", color = "0e8a16", description = "crates/cli/src/project: project status synchronization" },
    { name = "area:issues-check", color = "5319e7", description = "crates/cli/src/issues: issue rules and integrity auditor" },
    { name = "area:tooling", color = "2ea44f", description = "Flake, Nix, Just, CI, Cargo workspace" },
    { name = "area:docs", color = "0075ca", description = "Documentation, workflow guides, rules" },
    { name = "skip-changelog", color = "ededed", description = "Pull request that needs no CHANGELOG.md entry" },
]

# Legacy label migrations used by `issues-check --migrate`
[github.labels.migrations]
bug = "type:fix"
fix = "type:fix"
enhancement = "type:feat"
feature = "type:feat"
documentation = "type:docs"
chore = "type:chore"
refactor = "type:refactor"
spike = "type:spike"

[github.milestones]
unmanaged = "error"
renames = { "v0" = "v0.1.0", "v1" = "v0.2.0" }
items = [
    { title = "v0.1.0", description = "Bootstrap: issue workflow, repository setup, and tooling extraction", state = "closed" },
    { title = "v0.2.0", description = "Initial release: stable CLI distribution and packaging", state = "closed" },
    { title = "v0.3.0", description = "Cleanup and refactoring of hardcoded logic", state = "open" },
    { title = "v0.4.0", description = "Post-release iteration: audit rules on the workflow engine", state = "open" },
    { title = "v0.5.0", description = "Language-agnostic design token checking: template plus per-language checkers", state = "open" },
]

[github.issue_templates]
require_label = true
items = [
    { file = "feat.yml", label = "type:feat", title = "feat: " },
    { file = "fix.yml", label = "type:fix", title = "fix: " },
    { file = "chore.yml", label = "type:chore", title = "chore: " },
    { file = "docs.yml", label = "type:docs", title = "docs: " },
    { file = "refactor.yml", label = "type:refactor", title = "refactor: " },
    { file = "spike.yml", label = "type:spike", title = "spike: " },
]

[github.issues.rules]
cycle = true
labels = true
membership = false
milestone = true
parent = false
release = true

[workflow]
extends = "builtin:tools"
