name: 'Tools CLI Setup and Quality Audit'
description: 'Install the tools CLI from a pre-compiled release binary (or build it from source) and optionally run its issues, repo and project commands.'
author: 'jaoppb'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  version:
    description: 'Version of the tools binary to install (e.g. "v0.2.0" or "latest"); ignored with build-from-source'
    required: false
    default: 'latest'
  install-dir:
    description: 'Directory where the binary is installed'
    required: false
    default: '${{ runner.temp }}/tools-bin'
  repo:
    description: 'GitHub repository (owner/name) that publishes the tools release binaries'
    required: false
    default: 'jaoppb/tools'
  config-path:
    description: 'Path to tools.toml passed as --config to every tools command run by this action (default: upward search from the working directory)'
    required: false
    default: ''
  build-from-source:
    description: 'Build the tools binary with cargo from the checkout of this action instead of downloading a release (needs a Rust toolchain on the runner)'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for release downloads and running audits'
    required: false
    default: ${{ github.token }}
  cache:
    description: 'Enable cross-run caching of installed binaries'
    required: false
    default: 'true'
  check-issues:
    description: 'Run "tools issues check" immediately after installation'
    required: false
    default: 'false'
  check-repo:
    description: 'Run "tools repo check" immediately after installation'
    required: false
    default: 'false'
  check-project:
    description: 'Run "tools project check" (prints the planned Project Status moves, exits 1 when there are any) immediately after installation'
    required: false
    default: 'false'
  sync-project:
    description: 'Run "tools project sync" after installation, which applies the Status moves. Writing Projects v2 needs a PAT or app token in github-token; the default github.token cannot.'
    required: false
    default: 'false'
  issues-args:
    description: 'Additional CLI arguments passed to "tools issues check"'
    required: false
    default: ''
  repo-args:
    description: 'Additional CLI arguments passed to "tools repo check"'
    required: false
    default: ''
  project-args:
    description: 'Additional CLI arguments passed to "tools project check" and "tools project sync"'
    required: false
    default: ''

outputs:
  installed-version:
    description: 'Resolved version of the installed tools ("source" when built from source)'
    value: ${{ steps.resolve-version.outputs.version }}
  tools-dir:
    description: 'Directory where the tools binary is installed'
    value: ${{ inputs.install-dir }}

runs:
  using: 'composite'
  steps:
    - name: Resolve Version
      id: resolve-version
      shell: bash
      env:
        TOOLS_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        FROM_SOURCE: ${{ inputs.build-from-source }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        bash "${ACTION_PATH}/scripts/install-tools.sh" --resolve-version "$TOOLS_VERSION"

    - name: Cache Tools Binary
      if: inputs.cache == 'true' && inputs.build-from-source != 'true'
      id: cache-tools
      uses: actions/cache@v4
      with:
        path: ${{ inputs.install-dir }}
        key: tools-${{ inputs.repo }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve-version.outputs.version }}

    - name: Install Tools Binary
      id: install
      shell: bash
      env:
        TOOLS_VERSION: ${{ steps.resolve-version.outputs.version }}
        FROM_SOURCE: ${{ inputs.build-from-source }}
        SOURCE_DIR: ${{ github.action_path }}
        DEST_DIR: ${{ inputs.install-dir }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        CACHE_HIT: ${{ steps.cache-tools.outputs.cache-hit }}
        REPO: ${{ inputs.repo }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        bash "${ACTION_PATH}/scripts/install-tools.sh" "$TOOLS_VERSION" "$DEST_DIR"

    - name: Add to PATH
      shell: bash
      env:
        DEST_DIR: ${{ inputs.install-dir }}
      run: |
        echo "$DEST_DIR" >> "$GITHUB_PATH"

    - name: Run tools issues check
      if: inputs.check-issues == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        EXTRA_ARGS: ${{ inputs.issues-args }}
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        tools issues check ${CONFIG_PATH:+--config "$CONFIG_PATH"} $EXTRA_ARGS

    - name: Run tools repo check
      if: inputs.check-repo == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        EXTRA_ARGS: ${{ inputs.repo-args }}
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        tools repo check ${CONFIG_PATH:+--config "$CONFIG_PATH"} $EXTRA_ARGS

    - name: Run tools project check
      if: inputs.check-project == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        EXTRA_ARGS: ${{ inputs.project-args }}
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        tools project check ${CONFIG_PATH:+--config "$CONFIG_PATH"} $EXTRA_ARGS

    - name: Run tools project sync
      if: inputs.sync-project == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        EXTRA_ARGS: ${{ inputs.project-args }}
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        tools project sync ${CONFIG_PATH:+--config "$CONFIG_PATH"} $EXTRA_ARGS
