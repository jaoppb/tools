name: "Refactor"
description: "Restructure code without changing observable behaviour"
title: "refactor: "
labels: ["type:refactor"]
body:
  - type: markdown
    attributes:
      value: "After filing, set the appropriate `area:` label and milestone (`v0.1.0`, `v0.2.0`, etc.). See [AGENTS.md](../../AGENTS.md)."
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "What code is being restructured and why."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "Issues that must close first, or blocking relationships."
      value: |
        None.
  - type: textarea
    id: dod
    attributes:
      label: "Definition of Done"
      description: "Observable, checkable outcomes."
      value: |
        - [ ] Refactoring completed without regressions
        - [ ] `just check` passes with zero warnings
        - [ ] `just issues-check` passes
    validations:
      required: true
