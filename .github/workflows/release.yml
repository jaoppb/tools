name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Called by tag-release.yml: tags pushed with GITHUB_TOKEN do not trigger the push event.
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to validate, release and build
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate-version:
    name: Validate Release Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Validate tag matches Cargo.toml version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' does not match required format 'v<major>.<minor>.<patch>' (e.g. v0.1.0)"
            exit 1
          fi
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          expected_tag="v${cargo_version}"
          if [ "${TAG}" != "${expected_tag}" ]; then
            echo "::error::Tag '${TAG}' does not match Cargo.toml workspace version '${cargo_version}' (expected '${expected_tag}')"
            exit 1
          fi
          echo "Release tag ${TAG} matches Cargo.toml workspace version ${cargo_version}"

  create-release:
    name: Create GitHub Release
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          # The release notes are this version's CHANGELOG section, which links its migration guide.
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Build and Upload Assets (${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Build & Upload tools
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          bin: tools
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
