name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The `just` jobs and the flake check run in the flake devShell (`.github/actions/nix-devshell`),
  # so `just check` uses the toolchain pinned by flake.lock, as it does locally. Each job needs
  # `actions: write` because that action purges superseded Nix store caches.
  cargo:
    name: Workspace Check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the flake devShell
        uses: ./.github/actions/nix-devshell

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # rust-cache keys on the runner's rustc, not the devShell's; flake.lock pins the one used.
          key: ${{ hashFiles('flake.lock') }}

      - name: Run workspace checks, lints, and tests
        run: nix develop --command just check

  issues-check:
    name: Audit Issue Workflow Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the flake devShell
        uses: ./.github/actions/nix-devshell

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}

      - name: Run issues-check
        run: nix develop --command just issues-check

  repo-check:
    name: Audit Repository Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the flake devShell
        uses: ./.github/actions/nix-devshell

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}

      - name: Run repo-check
        run: nix develop --command just repo-check

  nix:
    name: Flake Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the flake devShell
        uses: ./.github/actions/nix-devshell

      - name: Run nix flake check
        run: nix flake check

  # Tests the consumer path of the root action.yml, which must not need Nix: a plain rustup
  # toolchain on the runner, as a consumer would have.
  action-test:
    name: Test Composite Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # No published release has the `tools` binary yet, so the action builds this checkout.
      - name: Test Composite Action
        uses: ./
        with:
          build-from-source: 'true'
          repo: 'jaoppb/tools'
          config-path: 'tools.toml'
          check-issues: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test check-project input (no project configured here)
        id: project-check
        continue-on-error: true
        uses: ./
        with:
          build-from-source: 'true'
          config-path: 'tools.toml'
          check-project: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert the project check ran and failed without a project
        env:
          OUTCOME: ${{ steps.project-check.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected tools project check to fail without [github.project], got '$OUTCOME'"
            exit 1
          fi
          # The action step only proves it failed; confirm the reason with the installed binary.
          if output="$(tools --config tools.toml project check 2>&1)"; then
            echo "::error::tools project check unexpectedly succeeded without [github.project]"
            exit 1
          fi
          echo "$output"
          grep -q "project number is required" <<<"$output"

      - name: Verify the installed binary on PATH
        run: |
          tools --help
          tools issues check --help
          tools repo check --help
          tools project check --help
