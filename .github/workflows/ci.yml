name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo:
    name: Workspace Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Run workspace checks, lints, and tests
        run: just check

  issues-check:
    name: Audit Issue Workflow Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Run issues-check
        run: just issues-check

  nix:
    name: Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run nix flake check
        run: nix flake check

  action-test:
    name: Test Composite Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test Composite Action
        uses: ./
        with:
          version: 'v0.1.0'
          repo: 'jaoppb/tools'
          config-path: 'tools.toml'
          check-issues: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test project-sync input (no project configured here)
        id: project-sync-dry-run
        continue-on-error: true
        uses: ./
        with:
          version: 'v0.1.0'
          config-path: 'tools.toml'
          sync-project: 'true'
          project-sync-args: '--dry-run'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert project-sync step ran and failed without a project
        env:
          OUTCOME: ${{ steps.project-sync-dry-run.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected project-sync to fail without [github.project], got '$OUTCOME'"
            exit 1
          fi

      - name: Verify installed binaries on PATH
        run: |
          issues-check --help
          repo-sync --help
          project-sync --help
