name: Tag Release

# A merged version bump (see scripts/bump-version.sh) changes the workspace version on
# main. This workflow tags that commit and publishes the release. scripts/release-tag.sh
# tags only when the push itself changed [workspace.package].version, so a later unrelated
# Cargo.toml change never releases under a version an earlier commit bumped.
# workflow_dispatch is the recovery path: it tags and releases exactly the requested ref.
# Tags pushed with GITHUB_TOKEN do not trigger release.yml, so it is called directly.

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z). Created at ref when missing; released as it is when it exists.
        required: true
        type: string
      ref:
        description: Commit, branch or tag to tag when the tag is missing (default the commit this run uses). When the tag exists, leave empty or give its commit.
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: tag-release

jobs:
  tag:
    name: Tag the workspace version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.push.outputs.tag || steps.dispatch.outputs.tag }}
    steps:
      # Full history: the push path compares with the commit before the push and the
      # dispatch path may tag an older ref.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag a version bump pushed to main
        id: push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: scripts/release-tag.sh push "${BEFORE}" "${AFTER}"

      - name: Tag or verify the requested release
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.ref }}
          DEFAULT_REF: ${{ github.sha }}
        run: scripts/release-tag.sh dispatch "${TAG}" "${REF}" "${DEFAULT_REF}"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
