name: 'Nix devShell'
description: 'Install Nix, restore the Nix store cache and realise the flake devShell. Internal to this repository CI; the root action.yml stays Nix-free.'

runs:
  using: 'composite'
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ github.token }}

    # Keyed on the flake, so a toolchain bump in flake.lock starts a new cache. A key miss starts
    # from an empty store (nothing restored by prefix: with no GC, an older store would carry its
    # old toolchain into every later cache), fetches from cache.nixos.org, saves the new store and
    # purges this ref's older entries (purging needs `actions: write` on the job). No GC before
    # saving: nothing roots the devShell closure, so a GC would drop exactly what the cache is for.
    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        purge: true
        purge-prefixes: nix-devshell-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never

    # Every job realises the devShell, so whichever job saves the cache first saves it whole.
    # The time printed here is the devShell startup cost of this run.
    - name: Realise the devShell
      shell: bash
      run: time nix develop --command true
