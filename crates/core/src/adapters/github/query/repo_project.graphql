# The Project id, number, and title.
fragment RepoProject on ProjectV2 {
  id
  number
  title
}

query {
  repositoryOwner(login: "@OWNER@") {
    ... on User {
      projectV2(number: @PROJECT@) {
        ...RepoProject
      }
    }
    ... on Organization {
      projectV2(number: @PROJECT@) {
        ...RepoProject
      }
    }
  }
}
