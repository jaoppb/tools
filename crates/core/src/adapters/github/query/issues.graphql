# One page of the repository's issues, open and closed, with what the audit reads.
query($cursor: String) {
  repository(owner: "@OWNER@", name: "@REPOSITORY@") {
    issues(first: 100, after: $cursor) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        number
        state
        labels(first: 30) { nodes { name } }
        milestone { title }
        parent { number }
        blockedBy(first: 50) {
          totalCount
          nodes {
            number
            repository { nameWithOwner }
          }
        }
      }
    }
  }
}
