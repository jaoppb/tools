# Sets the Status of one Project item. The four variables are passed by name:
# the Project id, the item id, the Status field id and the option id.
mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
  updateProjectV2ItemFieldValue(
    input: {
      projectId: $project
      itemId: $item
      fieldId: $field
      value: { singleSelectOptionId: $option }
    }
  ) {
    clientMutationId
  }
}
