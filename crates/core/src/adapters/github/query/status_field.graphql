# The Project id and the Status field with its options.
fragment StatusField on ProjectV2 {
  id
  field(name: "Status") {
    ... on ProjectV2SingleSelectField {
      id
      options { id name }
    }
  }
}

query {
  repositoryOwner(login: "@OWNER@") {
    ... on User {
      projectV2(number: @PROJECT@) {
        ...StatusField
      }
    }
    ... on Organization {
      projectV2(number: @PROJECT@) {
        ...StatusField
      }
    }
  }
}
