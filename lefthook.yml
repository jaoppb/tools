# Lefthook Git hooks configuration
# Documentation: https://github.com/evilmartians/lefthook
# Every command goes through a just recipe, which fails outside the flake devShell.

pre-commit:
  parallel: false
  commands:
    fmt:
      priority: 1
      glob: "*.rs"
      run: just fmt-check
    clippy:
      priority: 2
      glob: "*.{rs,toml,lock}"
      run: just lint

pre-push:
  parallel: false
  commands:
    check:
      run: just check
    issues-check:
      run: just issues-check
